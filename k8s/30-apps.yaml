apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderapp
  namespace: food-delivery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orderapp
  template:
    metadata:
      labels:
        app: orderapp
    spec:
      containers:
        - name: orderapp
          image: sushant2040/order-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9094
          env:
            - name: JAVA_OPS
              value: "-Xmx256m -XX:+UseSerialGC"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka-service:8761/eureka"
            - name: ORDER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: order-db-password
            - name: SPRING_DATA_MONGODB_URI
              value: "mongodb://order_user:$(ORDER_DB_PASSWORD)@mongo:27017/orderdb?authSource=orderdb"
          resources:
            requests:
              memory: 320Mi
            limits:
              memory: 640Mi
          readinessProbe:
            tcpSocket:
              port: 9094
            initialDelaySeconds: 60
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: food-delivery
spec:
  selector:
    app: orderapp
  ports:
    - port: 9094
