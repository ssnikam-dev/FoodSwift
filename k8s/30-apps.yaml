# The four Spring Boot services. DB settings override the yml via SPRING_* env vars.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurantapp
  namespace: food-delivery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: restaurantapp
  template:
    metadata:
      labels:
        app: restaurantapp
    spec:
      containers:
        - name: restaurantapp
          image: sushant2040/restaurant-listing-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9091
          env:
            - name: JAVA_OPS
              value: "-Xmx256m -XX:+UseSerialGC"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka-service:8761/eureka"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/restaurantdb?sslMode=DISABLED&allowPublicKeyRetrieval=true"
            - name: SPRING_DATASOURCE_USERNAME
              value: "restaurant_user"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: restaurant-db-password
          resources:
            requests:
              memory: 320Mi
            limits:
              memory: 640Mi
          readinessProbe:
            tcpSocket:
              port: 9091
            initialDelaySeconds: 60
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: restaurant-service
  namespace: food-delivery
spec:
  selector:
    app: restaurantapp
  ports:
    - port: 9091
      targetPort: 9091
---
