# Eureka server (needs the fixed application.yml: server.port 8761, register-with-eureka false).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka
  namespace: food-delivery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka
  template:
    metadata:
      labels:
        app: eureka
    spec:
      containers:
        - name: eureka
          image: sushant2040/eureka-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8761
          env:
            - name: JAVA_OPS
              value: "-Xmx200m -XX:+UseSerialGC"
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 8761
            initialDelaySeconds: 40
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-service
  namespace: food-delivery
spec:
  selector:
    app: eureka
  ports:
    - port: 8761
      targetPort: 8761
