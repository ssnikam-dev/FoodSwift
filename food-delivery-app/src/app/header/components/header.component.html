<header class="site-header">
  <div class="container site-header-inner">
    <a class="logo" routerLink="/">Food<span>Swift</span> Eats</a>

    <form class="header-search" role="search" (ngSubmit)="search()" #hs="ngForm">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input class="input" name="q" [(ngModel)]="query" placeholder="Search restaurants or cuisines" aria-label="Search restaurants">
    </form>

    <div class="header-actions">
      <a class="cart-link" routerLink="/cart" aria-label="Open cart">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6h15l-1.6 8.5a2 2 0 0 1-2 1.5H9a2 2 0 0 1-2-1.6L5 3H2"/><circle cx="10" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/></svg>
        <span class="cart-badge" *ngIf="(count$ | async) as n">{{ n }}</span>
      </a>

      <ng-container *ngIf="user$ | async as user; else guest">
        <div class="user-menu">
          <button class="user-chip" type="button" (click)="menuOpen = !menuOpen" [attr.aria-expanded]="menuOpen" aria-haspopup="menu">
            <span class="avatar">{{ initial(user.name) }}</span>
            <span class="hide-sm">{{ user.name }}</span>
          </button>
          <div class="menu-panel" role="menu" *ngIf="menuOpen">
            <div class="who">{{ user.email }}</div>
            <a class="menu-item" role="menuitem" routerLink="/cart" (click)="menuOpen = false">My cart</a>
            <button class="menu-item" role="menuitem" type="button" (click)="logout()">Log out</button>
          </div>
        </div>
      </ng-container>

      <ng-template #guest>
        <a class="btn btn-ghost" routerLink="/auth">Log in</a>
        <a class="btn btn-primary hide-sm" routerLink="/auth" [queryParams]="{ mode: 'register' }">Sign up</a>
      </ng-template>
    </div>
  </div>
</header>
